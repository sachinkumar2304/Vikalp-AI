<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001a38" />
      <stop offset="100%" stop-color="#002b5c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#1e3a5f" stroke-width="4" />

  <!-- Voice Audio Waves (Horizontal Axis) -->
  <g opacity="0.85">
    <line x1="80" y1="230" x2="120" y2="230" stroke="#FF9933" stroke-width="6" stroke-linecap="round" />
    <line x1="105" y1="205" x2="105" y2="255" stroke="#FF9933" stroke-width="6" stroke-linecap="round" />
    <line x1="125" y1="180" x2="125" y2="280" stroke="#FF9933" stroke-width="6" stroke-linecap="round" />
    <line x1="145" y1="210" x2="145" y2="250" stroke="#FF9933" stroke-width="6" stroke-linecap="round" />
    
    <line x1="220" y1="170" x2="220" y2="290" stroke="#34D399" stroke-width="6" stroke-linecap="round" />
    <line x1="240" y1="140" x2="240" y2="320" stroke="#10B981" stroke-width="6" stroke-linecap="round" />
    <line x1="260" y1="190" x2="260" y2="270" stroke="#059669" stroke-width="6" stroke-linecap="round" />
    <line x1="280" y1="210" x2="280" y2="250" stroke="#059669" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Left Arm of 'V': Dynamic Acoustic / Saffron Beams -->
  <g filter="url(#glow)">
    <line x1="140" y1="140" x2="235" y2="350" stroke="#FF9933" stroke-width="14" stroke-linecap="round" />
    <line x1="160" y1="160" x2="245" y2="365" stroke="#F97316" stroke-width="12" stroke-linecap="round" />
    <line x1="180" y1="185" x2="255" y2="375" stroke="#10B981" stroke-width="12" stroke-linecap="round" />
    <line x1="200" y1="210" x2="265" y2="385" stroke="#059669" stroke-width="10" stroke-linecap="round" />
  </g>

  <!-- Right Arm of 'V': Ascending Golden Arrow of Livelihood Opportunity -->
  <g filter="url(#glow)">
    <!-- Base curve linking left to right -->
    <path d="M 220 355 C 235 395, 275 395, 290 355 L 375 190" fill="none" stroke="url(#goldGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Arrowhead -->
    <path d="M 370 140 L 415 220 L 325 210 Z" fill="url(#goldGrad)" stroke="#B45309" stroke-width="3" stroke-linejoin="round" />
  </g>

  <!-- Brand Typography -->
  <text x="256" y="445" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">VIKALP AI</text>
  <text x="256" y="475" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#F59E0B" text-anchor="middle" letter-spacing="2">MoSJE • PM-AJAY GIA</text>
</svg>
