services:
  - type: web
    name: sathi-api
    runtime: python
    rootDir: SIH-fresh/VaaniPath-Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
